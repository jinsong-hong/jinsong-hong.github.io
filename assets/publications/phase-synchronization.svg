<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="title desc">
  <title id="title">Touchdown-triggered phase synchronization of four SLIP legs</title>
  <desc id="desc">Concept illustration of four leg cycle bars and a touchdown event that triggers a phase-gap comparison and next-cycle period adaptation. No measured data are shown.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#1f6f64" stroke-width="1.7"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b}.label{font-size:22px;font-weight:600}.detail{font-size:20px;fill:#52625f}.wire{fill:none;stroke:#1f6f64;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="900" height="500" rx="18" fill="#f7f8f5"/>
  <text x="36" y="52" font-size="28" font-weight="700">Touchdown-triggered phase synchronization</text>
  <text x="36" y="85" class="detail">Period adaptation coordinates independently controlled SLIP legs</text>
  <rect x="36" y="112" width="828" height="217" rx="15" fill="#fff" stroke="#d7e0da" stroke-width="2"/>
  <text x="64" y="148" class="label">Leg cycles</text>
  <text x="530" y="148" class="detail">Reference phase at touchdown</text>
  <g font-size="20" fill="#52625f">
    <text x="64" y="185">Front left</text><text x="64" y="225">Front right</text>
    <text x="64" y="265">Rear left</text><text x="64" y="305">Rear right</text>
  </g>
  <g fill="#e7eee9">
    <rect x="199" y="168" width="618" height="22" rx="11"/><rect x="199" y="208" width="618" height="22" rx="11"/>
    <rect x="199" y="248" width="618" height="22" rx="11"/><rect x="199" y="288" width="618" height="22" rx="11"/>
  </g>
  <g fill="#1f6f64">
    <rect x="199" y="168" width="173" height="22" rx="11"/><rect x="439" y="168" width="173" height="22" rx="11"/><rect x="679" y="168" width="138" height="22" rx="11"/>
    <rect x="298" y="208" width="173" height="22" rx="11"/><rect x="538" y="208" width="173" height="22" rx="11"/>
    <rect x="306" y="248" width="173" height="22" rx="11"/><rect x="546" y="248" width="173" height="22" rx="11"/>
    <rect x="199" y="288" width="173" height="22" rx="11"/><rect x="439" y="288" width="173" height="22" rx="11"/><rect x="679" y="288" width="138" height="22" rx="11"/>
  </g>
  <path d="M538 160 V320" stroke="#b5653c" stroke-width="2.5" stroke-dasharray="5 6"/>
  <circle cx="538" cy="219" r="8" fill="#b5653c" stroke="#fff" stroke-width="2"/>
  <path d="M538 321 V346 H152 V360" class="wire"/>
  <g fill="#fff" stroke="#b8cdc5" stroke-width="2">
    <rect x="36" y="369" width="235" height="76" rx="12"/>
    <rect x="324" y="369" width="223" height="76" rx="12"/>
    <rect x="600" y="369" width="264" height="76" rx="12"/>
  </g>
  <text x="154" y="400" text-anchor="middle" class="label">Touchdown event</text>
  <text x="154" y="427" text-anchor="middle" class="detail">sample reference phase</text>
  <text x="435" y="400" text-anchor="middle" class="label">Compare phase gap</text>
  <text x="435" y="427" text-anchor="middle" class="detail">reference ↔ other leg</text>
  <text x="732" y="400" text-anchor="middle" class="label">Adapt next-cycle period</text>
  <text x="732" y="427" text-anchor="middle" class="detail">correct inter-leg timing</text>
  <path class="wire" d="M273 407 H314 M549 407 H590"/>
  <text x="36" y="474" font-size="16" fill="#697672">Schematic cycles · no measured data</text>
  <text x="864" y="474" text-anchor="end" font-size="16" fill="#697672">Concept illustration</text>
</svg>
