<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="title desc">
  <title id="title">Cascaded disturbance observers for quadruped body orientation</title>
  <desc id="desc">Concept illustration of an outer Body DOB, a body-to-leg kinematic map, an inner Leg DOB controller, and a quadruped with body and leg feedback.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#1f6f64" stroke-width="1.7"/></marker>
    <marker id="warm-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b5653c" stroke-width="1.7"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b}.label{font-size:22px;font-weight:600}.detail{font-size:20px;fill:#52625f}.wire{fill:none;stroke:#1f6f64;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.box{fill:#fff;stroke:#b8cdc5;stroke-width:2}</style>
  </defs>
  <rect width="900" height="500" rx="18" fill="#f7f8f5"/>
  <text x="36" y="52" font-size="28" font-weight="700">Cascaded disturbance rejection</text>
  <text x="36" y="85" class="detail">A body orientation loop supported by robust leg control</text>
  <rect class="box" x="32" y="138" width="200" height="120" rx="13"/>
  <rect class="box" x="276" y="138" width="208" height="120" rx="13"/>
  <rect class="box" x="528" y="138" width="200" height="120" rx="13"/>
  <rect x="32" y="138" width="200" height="8" rx="4" fill="#b5653c"/>
  <rect x="276" y="138" width="208" height="8" rx="4" fill="#1f6f64"/>
  <rect x="528" y="138" width="200" height="8" rx="4" fill="#1f6f64"/>
  <text x="132" y="180" text-anchor="middle" class="label">Outer Body DOB</text>
  <text x="132" y="212" text-anchor="middle" class="detail">roll / pitch</text>
  <text x="132" y="238" text-anchor="middle" class="detail">compensation</text>
  <text x="380" y="180" text-anchor="middle" class="label">Body-to-leg</text>
  <text x="380" y="210" text-anchor="middle" class="label">kinematic map</text>
  <text x="380" y="238" text-anchor="middle" class="detail">radial velocity</text>
  <text x="628" y="180" text-anchor="middle" class="label">Inner Leg DOB</text>
  <text x="628" y="212" text-anchor="middle" class="detail">leg controller</text>
  <text x="628" y="238" text-anchor="middle" class="detail">leg dynamics</text>
  <path class="wire" d="M233 198 H268"/>
  <path class="wire" d="M485 198 H520"/>
  <path class="wire" d="M729 198 H754"/>
  <g fill="none" stroke="#17212b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M771 210 L755 246 L767 281 M794 213 L810 246 L801 281" stroke="#74817c" stroke-width="5"/>
    <path d="M783 214 L773 244 L782 280 M846 214 L858 244 L850 280"/>
  </g>
  <rect x="765" y="172" width="99" height="47" rx="9" fill="#17212b"/>
  <rect x="773" y="180" width="35" height="7" rx="3" fill="#77a899"/>
  <circle cx="780" cy="213" r="6" fill="#b5653c"/>
  <circle cx="844" cy="213" r="6" fill="#b5653c"/>
  <path d="M747 283 H873" stroke="#b8cdc5" stroke-width="3" stroke-linecap="round"/>
  <text x="811" y="315" text-anchor="middle" class="label">Quadruped</text>
  <path class="wire" stroke-dasharray="7 6" d="M768 287 H742 V347 H628 V268"/>
  <rect x="565" y="328" width="130" height="26" rx="5" fill="#f7f8f5"/>
  <text x="630" y="348" text-anchor="middle" class="detail">Leg feedback</text>
  <path d="M850 323 V413 H132 V268" fill="none" stroke="#b5653c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#warm-arrow)"/>
  <rect x="306" y="395" width="286" height="29" rx="5" fill="#f7f8f5"/>
  <text x="449" y="417" text-anchor="middle" font-size="20" fill="#b5653c">Body orientation feedback</text>
  <text x="864" y="474" text-anchor="end" font-size="16" fill="#697672">Concept illustration</text>
</svg>
