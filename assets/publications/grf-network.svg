<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc"><title id="title">Friction-aware sensorless GRF estimation</title><desc id="desc">Joint signals feed a Lagrangian rigid-body dynamics model and a temporal friction model. Their combined dynamics support ground reaction force estimation. This is a concept illustration, not an original paper figure or measured result.</desc><defs><marker id="arrow-1f6f64" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f6f64"/></marker><marker id="arrow-b5653c" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b5653c"/></marker><marker id="arrow-17212b" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#17212b"/></marker></defs><rect width="900" height="500" fill="#f7f8f5"/><g font-family="Arial, Helvetica, sans-serif"><text x="52" y="49" font-size="23" text-anchor="start" fill="#1f6f64" font-weight="700">SENSORLESS GRF ESTIMATION</text><g transform="translate(118 138) scale(1.15)"><path d="M0 0 L65 78 L15 164" fill="none" stroke="#17212b" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="0" r="12" fill="#ffffff" stroke="#1f6f64" stroke-width="4"/><circle cx="65" cy="78" r="11" fill="#ffffff" stroke="#1f6f64" stroke-width="4"/><rect x="-5" y="158" width="42" height="13" rx="6" fill="#17212b"/></g><path d="M60 352 H265" stroke="#65716d" stroke-width="3"/><path d="M70 352 l-12 15" fill="none" stroke="#b9c2b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M94 352 l-12 15" fill="none" stroke="#b9c2b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M118 352 l-12 15" fill="none" stroke="#b9c2b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M142 352 l-12 15" fill="none" stroke="#b9c2b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M166 352 l-12 15" fill="none" stroke="#b9c2b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M190 352 l-12 15" fill="none" stroke="#b9c2b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M214 352 l-12 15" fill="none" stroke="#b9c2b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M238 352 l-12 15" fill="none" stroke="#b9c2b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M262 352 l-12 15" fill="none" stroke="#b9c2b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="164" y="401" font-size="24" text-anchor="middle" fill="#17212b" font-weight="500">Articulated leg</text><text x="144" y="113" font-size="24" text-anchor="middle" fill="#17212b" font-weight="500">Joint signals</text><path d="M258 225 L327 225" fill="none" stroke="#1f6f64" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-1f6f64)"/><rect x="338" y="96" width="270" height="110" rx="18" fill="#ffffff" stroke="#1f6f64" stroke-width="2.5"/><text x="473.0" y="144.0" font-size="23" text-anchor="middle" fill="#17212b" font-weight="500">Lagrangian model</text><text x="473.0" y="174.0" font-size="23" text-anchor="middle" fill="#17212b" font-weight="500">Rigid-body dynamics</text><rect x="338" y="248" width="270" height="110" rx="18" fill="#fff9f3" stroke="#b5653c" stroke-width="2.5"/><text x="473.0" y="296.0" font-size="23" text-anchor="middle" fill="#17212b" font-weight="500">Temporal friction</text><text x="473.0" y="326.0" font-size="23" text-anchor="middle" fill="#17212b" font-weight="500">History + coupling</text><path d="M608 151 H650 V225 H689" fill="none" stroke="#1f6f64" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1f6f64)"/><path d="M608 303 H650 V225"