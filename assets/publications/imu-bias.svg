<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc"><title id="title">Force observer-based IMU bias compensation</title><desc id="desc">Body acceleration estimated from ground reaction forces is compared with IMU acceleration. Their difference contributes to accelerometer bias compensation in Kalman-filter state estimation. This is a concept illustration, not an original paper figure or measured result.</desc><defs><marker id="arrow-1f6f64" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f6f64"/></marker><marker id="arrow-b5653c" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b5653c"/></marker><marker id="arrow-17212b" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#17212b"/></marker></defs><rect width="900" height="500" fill="#f7f8f5"/><g font-family="Arial, Helvetica, sans-serif"><text x="50" y="49" font-size="23" text-anchor="start" fill="#1f6f64" font-weight="700">FORCE OBSERVER-BASED IMU BIAS COMPENSATION</text><rect x="57" y="187" width="173" height="63" rx="14" fill="#ffffff" stroke="#17212b" stroke-width="4"/><path d="M82 251 L65 292 L82 335 M208 251 L225 292 L208 335" fill="none" stroke="#17212b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 342 H252" stroke="#65716d" stroke-width="3"/><path d="M50 342 l-12 15" fill="none" stroke="#b9c2b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M74 342 l-12 15" fill="none" stroke="#b9c2b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M98 342 l-12 15" fill="none" stroke="#b9c2b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M122 342 l-12 15" fill="none" stroke="#b9c2b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M146 342 l-12 15" fill="none" stroke="#b9c2b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M170 342 l-12 15" fill="none" stroke="#b9c2b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M194 342 l-12 15" fill="none" stroke="#b9c2b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M218 342 l-12 15" fill="none" stroke="#b9c2b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M242 342 l-12 15" fill="none" stroke="#b9c2b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M84 332 L84 268" fill="none" stroke="#1f6f64" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-1f6f64)"/><path d="M208 332 L208 268" fill="none" stroke="#1f6f64" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-1f6f64)"/><text x="144" y="397" font-size="23" text-anchor="middle" fill="#17212b" font-weight="500">Onboard signals</text><rect x="280" y="92" width="235" height="94" rx="18" fill="#ffffff" stroke="#1f6f64" stroke-width="2.5"/><text x="397.5" y="132.0" font-size="23" text-anchor="middle" fill="#17212b" font-weight="500">Force observer</text><text x="397.5" y="162.0" font-size="23" text-anchor="middle" fill="#17212b" font-weight="500">Body acceleration</text><rect x="280" y="286" width="235" height="94" rx="18" fill="#fff9f3" stroke="#b5653c" stroke-width="2.5"/><text x="397.5" y="326.0" font-size="23" text-anchor="middle" fill="#17212b" font-weight="500">IMU</text><text x="397.5" y="356.0" font-size="23" text-anchor="middle" fill="#17212b" font-weight="500">Measured acceleration</text><path d="M238 218 H259 V139 H275" fill="none" stroke="#1f6f64" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1f6f64)"/><path d="M250 239 H261 V333 H275" fill="none" stroke="#b5653c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-b5653c)"/><path d="M515 139 H551 V234 H578" fill="none" stroke="#1f6f64" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1f6f64)"/><path d="M515 333 H551 V234" fill="none" stroke="#b5653c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="603" cy="234" r="24" fill="#ffffff" stroke="#1f6f64" stroke-width="3"/><text x="603" y="242" font-size="24" text-anchor="middle" fill="#17212b" font-weight="500">Δ</text><text x="603" y="187" font-size="22" text-anchor="middle" fill="#17212b" font-weight="500">Difference</text><path d="M630 234 L673 234" fill="none" stroke="#1f6f64" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-1f6f64)"/><rect x="684" y="189" width="170" height="92" rx="18" fill="#ffffff" stroke="#1f6f64" stroke-width="2.5"/><text x="769.0" y="228.0" font-size="23" text-anchor="middle" fill="#17212b" font-weight="500">Bias</text><text x="769.0" y="258.0" font-size="23" text-anchor="middle" fill="#17212b" font-weight="500">compensation</text><path d="M769 284 L769 333" fill="none" stroke="#1f6f64" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-1f6f64)"/><rect x="623" y="347" width="231" height="74" rx="18" fill="#ffffff" stroke="#1f6f64" stroke-width="2.5"/><text x="738.5" y="392.0" font-size="21" text-anchor="middle" fill="#17212b" font-weight="500">Kalman state estimate</text><text x="738" y="443" font-size="21" text-anchor="middle" fill="#17212b" font-weight="500">Position + velocity</text><text x="450" y="471" font-size="20" text-anchor="middle" fill="#65716d" font-weight="400">Concept illustration</text></g></svg>